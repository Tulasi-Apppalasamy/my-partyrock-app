name: Deploy Kids Meal Planner

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: aws-actions/setup-sam@v2

      - name: SAM Build
        run: sam build --template infra/template.yaml

      - name: SAM Deploy
        run: |
          sam deploy \
            --stack-name kids-daily-meal-planner-with-ai-assistant \
            --s3-bucket ${{ secrets.SAM_DEPLOY_BUCKET }} \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --region us-east-1 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Inject URLs and upload frontend
        run: |
          get_output() {
            aws cloudformation describe-stacks \
              --stack-name kids-daily-meal-planner-with-ai-assistant \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" \
              --output text
          }

          DIAGRAM_URL=$(get_output DiagramApiUrl)
          sed -i "s|__DIAGRAM_API_URL__|$DIAGRAM_URL|g" frontend/index.html

          URL=$(get_output DailyMealPlanUrl)
          sed -i "s|__URL_DAILY_MEAL_PLAN__|$URL|g" frontend/index.html

          URL=$(get_output ShoppingListUrl)
          sed -i "s|__URL_SHOPPING_LIST__|$URL|g" frontend/index.html

          URL=$(get_output MealPlanAssistantChatUrl)
          sed -i "s|__URL_MEAL_PLAN_ASSISTANT_CHAT__|$URL|g" frontend/index.html

          BUCKET=$(get_output BucketName)
          aws s3 sync frontend/ s3://$BUCKET/ --cache-control no-cache

          echo "App URL: $(get_output WebsiteUrl)"
